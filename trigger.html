<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow">
    <title>Christmas 2026</title>

    <!-- Hanya 3 script ini. Jangan tambah mindar-image.prod.js atau mindar-image-three.prod.js -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        /* JANGAN kasih background berwarna di html/body: video kamera ada di belakang dan akan tertutup */
        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: system-ui, sans-serif
        }

        #hint {
            position: fixed;
            left: 0;
            right: 0;
            bottom: calc(32px + env(safe-area-inset-bottom, 0px));
            z-index: 10;
            text-align: center;
            color: #fff;
            font-size: 1rem;
            text-shadow: 0 2px 8px rgba(0, 0, 0, .8);
            pointer-events: none;
            padding: 0 24px;
            transition: opacity .3s
        }

        #hint.off {
            opacity: 0
        }

        /* status debug, hapus elemen #dbg dan bagian scriptnya kalau sudah beres */
        #dbg {
            position: fixed;
            top: calc(12px + env(safe-area-inset-top, 0px));
            left: 0;
            right: 0;
            z-index: 10;
            text-align: center;
            color: #ff0;
            font-size: .8rem;
            text-shadow: 0 1px 4px #000;
            pointer-events: none;
            padding: 0 16px
        }
    </style>
</head>

<body>

    <p id="hint">Opening camera...</p>
    <p id="dbg"></p>

    <!--
      SATU file targets.mindgu berisi 9 gambar. Urutan upload di compiler = targetIndex:
      char1 -> 0, char2 -> 1, ... char9 -> 8.
      maxTrack: 1 = satu kartu sekali deteksi (lebih ringan). Naikkan kalau mau beberapa kartu sekaligus.
    -->
    <a-scene
        mindar-image="imageTargetSrc: assets/update.mind; maxTrack: 1; autoStart: true; uiLoading: yes; uiScanning: no; uiError: yes;"
        color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity light="type: ambient; intensity: 1.2"></a-entity>
        <a-entity light="type: directional; intensity: 1.5" position="1 2 3"></a-entity>

        <!-- Satu baris = satu karakter. Atur glb, rotation (data-rot), position (data-pos), scale (data-scale) di sini. -->
        <a-entity class="tgt" data-name="char1" data-glb="char1/char1.glb" data-rot="05 0 0" data-pos="0 0 0"
            data-scale="2.5 2.5 2.5" mindar-image-target="targetIndex: 0"></a-entity>
        <a-entity class="tgt" data-name="char2" data-glb="char2/char2.glb" data-rot="35 0 0" data-pos="0 0 0"
            data-scale="2.5 2.5 2.5" mindar-image-target="targetIndex: 1"></a-entity>
        <a-entity class="tgt" data-name="char3" data-glb="char3/char3.glb" data-rot="65 0 0" data-pos="0 0 0"
            data-scale="2.5 2.5 2.5" mindar-image-target="targetIndex: 2"></a-entity>
        <a-entity class="tgt" data-name="char4" data-glb="char4/char4.glb" data-rot="95 0 0" data-pos="0 0 0"
            data-scale="2.5 2.5 2.5" mindar-image-target="targetIndex: 3"></a-entity>
        <a-entity class="tgt" data-name="char5" data-glb="char5/char5.glb" data-rot="125 0 0" data-pos="0 0 0"
            data-scale="2.5 2.5 2.5" mindar-image-target="targetIndex: 4"></a-entity>
        <a-entity class="tgt" data-name="char6" data-glb="char6/char6.glb" data-rot="155 0 0" data-pos="0 0 0"
            data-scale="2.5 2.5 2.5" mindar-image-target="targetIndex: 5"></a-entity>
        <a-entity class="tgt" data-name="char7" data-glb="char7/char7.glb" data-rot="180 0 0" data-pos="0 0 0"
            data-scale="2.5 2.5 2.5" mindar-image-target="targetIndex: 6"></a-entity>
        <a-entity class="tgt" data-name="char8" data-glb="char8/char8.glb" data-rot="0 0 0" data-pos="0 0 0"
            data-scale="2.5 2.5 2.5" mindar-image-target="targetIndex: 7"></a-entity>
        <a-entity class="tgt" data-name="char9" data-glb="char9/char9.glb" data-rot="45 0 0" data-pos="0 0 0"
            data-scale="2.5 2.5 2.5" mindar-image-target="targetIndex: 8"></a-entity>
    </a-scene>

    <script>
        const hint = document.getElementById('hint'), dbg = document.getElementById('dbg'),
            scene = document.querySelector('a-scene');

        let cam = 'loading', card = '', glb = '';
        const show = () => dbg.textContent = 'camera: ' + cam + (card ? ' | card: ' + card : '') + (glb ? ' | GLB: ' + glb : '');
        show();

        scene.addEventListener('arReady', () => { cam = 'OK'; hint.textContent = 'Point the camera at a card'; show(); });
        scene.addEventListener('arError', () => {
            cam = 'ERROR';
            hint.textContent = 'Camera failed to open. Open in Safari/Chrome and allow camera access.';
            hint.classList.remove('off'); show();
        });

        // GLB baru dimuat saat kartunya pertama kali terdeteksi, lalu dipakai ulang
        document.querySelectorAll('.tgt').forEach(el => {
            el.addEventListener('targetFound', () => {
                card = el.dataset.name; hint.classList.add('off');
                if (!el.querySelector('a-gltf-model')) {
                    const m = document.createElement('a-gltf-model');
                    m.setAttribute('src', el.dataset.glb);
                    m.setAttribute('rotation', el.dataset.rot);
                    m.setAttribute('position', el.dataset.pos);
                    m.setAttribute('scale', el.dataset.scale);
                    m.setAttribute('animation-mixer', '');
                    m.addEventListener('model-loaded', () => { glb = 'OK'; show(); });
                    m.addEventListener('model-error', () => { glb = 'FAILED (cek path ' + el.dataset.glb + ')'; show(); });
                    glb = 'loading';
                    el.appendChild(m);
                }
                show();
            });
            el.addEventListener('targetLost', () => { hint.classList.remove('off'); card = ''; show(); });
        });

        window.addEventListener('error', e => { dbg.textContent = 'Error: ' + e.message; });
        window.addEventListener('unhandledrejection', e => { dbg.textContent = 'Error: ' + (e.reason && e.reason.message || e.reason); });
    </script>
</body>

</html>
