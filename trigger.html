<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow">
    <title>Christmas 2026</title>

    <!-- Percepat koneksi ke CDN, dan mulai unduh file .mind SEKARANG (paralel dengan script & izin kamera).
         PENTING: href preload harus SAMA PERSIS dengan imageTargetSrc di <a-scene>. -->
    <link rel="preconnect" href="https://aframe.io">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preload" href="assets/update.mind" as="fetch" crossorigin>

    <!-- Hanya 2 script ini. Jangan tambah mindar-image.prod.js atau mindar-image-three.prod.js.
         (aframe-extras dihapus: animasi GLB sekarang dimainkan oleh kode sendiri di bawah) -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        /* JANGAN kasih background berwarna di html/body: video kamera ada di belakang dan akan tertutup */
        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: system-ui, sans-serif
        }

        #hint {
            position: fixed;
            left: 0;
            right: 0;
            bottom: calc(32px + env(safe-area-inset-bottom, 0px));
            z-index: 10;
            text-align: center;
            color: #fff;
            font-size: 1rem;
            text-shadow: 0 2px 8px rgba(0, 0, 0, .8);
            pointer-events: none;
            padding: 0 24px;
            transition: opacity .3s
        }

        #hint.off {
            opacity: 0
        }

        /* teks kuning untuk testing: tampil/sembunyi diatur lewat DEBUG di script paling bawah */
        #dbg {
            position: fixed;
            top: calc(12px + env(safe-area-inset-top, 0px));
            left: 0;
            right: 0;
            z-index: 10;
            text-align: center;
            color: #ff0;
            font-size: .8rem;
            text-shadow: 0 1px 4px #000;
            pointer-events: none;
            padding: 0 16px
        }

        /* ===== Layar bantuan saat kamera ditolak / tidak bisa dibuka ===== */
        #camfix {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: calc(24px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) calc(24px + env(safe-area-inset-left, 0px));
            background: #9a1409;
            color: #fdf1df;
            text-align: center;
            overflow: auto
        }

        #camfix.on {
            display: flex
        }

        #camfix .box {
            width: 100%;
            max-width: 420px
        }

        #camfix h2 {
            margin: 0 0 10px;
            font-size: 1.5rem;
            color: #f2b630
        }

        #camfix p {
            margin: 0 0 14px;
            line-height: 1.5
        }

        #camfix ol {
            text-align: left;
            margin: 0 0 18px;
            padding-left: 1.3em;
            line-height: 1.5
        }

        #camfix li {
            margin: 6px 0
        }

        #camfix .b {
            display: block;
            width: 100%;
            margin: 10px 0 0;
            padding: 14px 18px;
            border: 0;
            border-radius: 999px;
            font: inherit;
            font-weight: 700;
            font-size: 1rem;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            background: rgba(255, 255, 255, .18);
            color: #fdf1df
        }

        #camfix .b.main {
            background: #f2b630;
            color: #9a1409
        }

        #camfix .b:disabled {
            opacity: .6;
            cursor: default
        }
    </style>
</head>

<body>

    <p id="hint">Opening camera...</p>
    <p id="dbg"></p>

    <div id="camfix" role="alertdialog" aria-labelledby="cf-title">
        <div class="box">
            <h2 id="cf-title">We need your camera</h2>
            <p id="cf-msg"></p>
            <ol id="cf-steps"></ol>
            <button class="b main" id="cf-retry">Try again</button>
            <button class="b" id="cf-copy" style="display:none">Copy link</button>
            <a class="b" href="index.html">Back</a>
        </div>
    </div>

    <!--
      SATU file .mind berisi 10 gambar. Urutan upload di compiler = targetIndex:
      char1 -> 0, char2 -> 1, ... char10 -> 9.
      maxTrack: 1 = satu kartu sekali deteksi (lebih ringan). Naikkan kalau mau beberapa kartu sekaligus.
    -->
    <a-scene
        mindar-image="imageTargetSrc: assets/update.mind; maxTrack: 1; filterMinCF: 0.0005; filterBeta: 50; missTolerance: 10; autoStart: true; uiLoading: yes; uiScanning: no; uiError: no;"
        color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity light="type: ambient; intensity: 1.2"></a-entity>
        <a-entity light="type: directional; intensity: 1.5" position="1 2 3"></a-entity>

        <!-- Satu baris = satu karakter.
             data-scale = UKURAN (kecilkan di sini, mis. 0.8 0.8 0.8)
             data-rot   = rotasi, data-pos = posisi
             data-anim  = loop (gerak terus) | once (main sekali lalu diam di pose akhir) | none (tanpa animasi)
             data-fx    = off (tanpa partikel) | snow | night | wood | light  (hanya beda GAMBAR, lihat FX_MODES) -->
        <a-entity class="tgt" data-name="char1" data-glb="char1/char1.glb" data-rot="20 0 0" data-pos="0 0 0"
            data-scale="0.8 0.8 0.8" data-anim="loop" data-fx="light" mindar-image-target="targetIndex: 0"></a-entity>
        <a-entity class="tgt" data-name="char2" data-glb="char2/char2.glb" data-rot="30 0 0" data-pos="0 0 0"
            data-scale="0.8 0.8 0.8" data-anim="loop" data-fx="light" mindar-image-target="targetIndex: 1"></a-entity>
        <a-entity class="tgt" data-name="char3" data-glb="char3/char3.glb" data-rot="40 0 0" data-pos="0 0 0"
            data-scale="0.8 0.8 0.8" data-anim="loop" data-fx="light" mindar-image-target="targetIndex: 2"></a-entity>
        <a-entity class="tgt" data-name="char4" data-glb="char4/char4.glb" data-rot="50 0 0" data-pos="0 0 0"
            data-scale="0.8 0.8 0.8" data-anim="loop" data-fx="night" mindar-image-target="targetIndex: 3"></a-entity>
        <a-entity class="tgt" data-name="char5" data-glb="char5/char5.glb" data-rot="60 0 0" data-pos="0 0 0"
            data-scale="0.8 0.8 0.8" data-anim="once" data-fx="night" mindar-image-target="targetIndex: 4"></a-entity>
        <a-entity class="tgt" data-name="char6" data-glb="char6/char6.glb" data-rot="70 0 0" data-pos="0 0 0"
            data-scale="0.8 0.8 0.8" data-anim="once" data-fx="night" mindar-image-target="targetIndex: 5"></a-entity>
        <a-entity class="tgt" data-name="char7" data-glb="char7/char7.glb" data-rot="80 0 0" data-pos="0 0 0"
            data-scale="0.8 0.8 0.8" data-anim="once" data-fx="wood" mindar-image-target="targetIndex: 6"></a-entity>
        <a-entity class="tgt" data-name="char8" data-glb="char8/char8.glb" data-rot="90 0 0" data-pos="0 0 0"
            data-scale="0.8 0.8 0.8" data-anim="once" data-fx="wood" mindar-image-target="targetIndex: 7"></a-entity>
        <a-entity class="tgt" data-name="char9" data-glb="char9/char9.glb" data-rot="100 0 0" data-pos="0 0 0"
            data-scale="0.8 0.8 0.8" data-anim="once" data-fx="wood" mindar-image-target="targetIndex: 8"></a-entity>
        <a-entity class="tgt" data-name="char10" data-glb="char10/char10.glb" data-rot="110 0 0" data-pos="0 0 0"
            data-scale="0.8 0.8 0.8" data-anim="loop" data-fx="snow" mindar-image-target="targetIndex: 9"></a-entity>
    </a-scene>

    <script>
        // ===== PENGATURAN EFEK: semua angka ada di sini =====
        // Satuan: lebar kartu = 1 unit. Sumbu Z = tegak lurus kartu (naik dari permukaan kartu).
        // Penghalus gerakan: model mengikuti kartu dengan halus, jadi tidak goyang.
        const SMOOTH = {
            on: true,       // false = ikuti kartu apa adanya (seperti sebelumnya)
            slow: 3,        // saat kartu nyaris diam: KECILKAN = makin stabil (mis. 1.5), besarkan = lebih responsif
            fast: 20,       // saat kartu digerakkan: BESARKAN = model lebih cepat menyusul
            range: 0.05     // batas "gerakan kecil" dianggap goyangan
        };

        // VERSI ASET: NAIKKAN angka ini (mis. '2', '3') setiap kali kamu push GLB/PNG/lagu baru,
        // supaya HP tidak memakai file lama dari cache.
        const ASSET_VER = '1';

        // Gambar per mode: HANYA ini yang beda antar mode. Animasi & setting sama semua.
        // Untuk ganti aset, cukup ubah nama file PNG di sini.
        const FX_MODES = {
            snow: { img: 'assets/snowflake.png' },
            night: { img: 'assets/night.png' },   // <- ganti nama file
            wood: { img: 'assets/wood.png' },      // <- ganti nama file
            light: { img: 'assets/light.png' }      // <- ganti nama file
        };

        // Setting partikel (dipakai SEMUA mode). Semua angka RELATIF KE LAYAR HP, jadi pasti memenuhi layar.
        const PARTICLE = {
            count: 60,              // jumlah butiran (turunkan ke 80 kalau HP berat, naikkan kalau mau lebih ramai)
            sizeMin: 0.005,         // butiran paling kecil (0.015 = 1.5% tinggi layar)
            sizeMax: 0.05,          // butiran paling besar
            sizeBias: 1.6,          // 1 = rata, makin besar = makin banyak yang kecil, sedikit yang besar
            speedMin: 0.04,         // kecepatan jatuh paling lambat (tinggi layar per detik)
            speedMax: 0.13,         // kecepatan jatuh paling cepat (butiran besar cenderung lebih cepat)
            flutter: 0.03,          // goyangan kiri-kanan (lebar layar)
            spin: 0.9,              // kecepatan berputar (0 = tidak berputar)
            fade: 0.5,              // bagian atas/bawah layar untuk fade in/out (0-0.5)
            margin: 0.1,            // butiran mulai sedikit di atas layar dan hilang sedikit di bawah layar
            opacityMin: 0.1,        // transparansi terendah
            opacityMax: 1           // transparansi tertinggi
        };
        const FXLOG = { msg: '', anim: '' };

        function flakeTex() {
            const c = document.createElement('canvas'); c.width = c.height = 64;
            const x = c.getContext('2d'), g = x.createRadialGradient(32, 32, 2, 32, 32, 30);
            g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.6, 'rgba(255,255,255,1)');
            g.addColorStop(.8, 'rgba(150,190,255,.9)'); g.addColorStop(1, 'rgba(150,190,255,0)');
            x.fillStyle = g; x.beginPath(); x.arc(32, 32, 30, 0, 6.2832); x.fill();
            return new AFRAME.THREE.CanvasTexture(c);
        }

        // Holder mengikuti kartu dengan penghalus: gerakan kecil (goyangan tracking) diredam,
        // gerakan besar (HP/kartu digeser) tetap diikuti.
        AFRAME.registerComponent('smooth-follow', {
            init() {
                const T = AFRAME.THREE;
                this.src = this.el.targetEl.object3D;
                this.p = new T.Vector3(); this.q = new T.Quaternion(); this.s = new T.Vector3(1, 1, 1);
                this.tp = new T.Vector3(); this.tq = new T.Quaternion(); this.ts = new T.Vector3(1, 1, 1);
                this.ready = false;
                this.el.object3D.visible = false;
            },
            tick(t, dt) {
                const o = this.el.object3D, src = this.src;
                o.visible = src.visible;
                if (!src.visible) { this.ready = false; return; }
                src.matrix.decompose(this.tp, this.tq, this.ts);
                if (!this.ready || !SMOOTH.on) {
                    this.p.copy(this.tp); this.q.copy(this.tq); this.s.copy(this.ts); this.ready = true;
                } else {
                    dt = Math.min(dt, 100) / 1000;
                    const ang = 2 * Math.acos(Math.min(1, Math.abs(this.q.dot(this.tq))));
                    const d = this.p.distanceTo(this.tp) + ang * 0.3;
                    const k = SMOOTH.slow + (SMOOTH.fast - SMOOTH.slow) * Math.min(1, d / SMOOTH.range);
                    const a = 1 - Math.exp(-k * dt);
                    this.p.lerp(this.tp, a); this.q.slerp(this.tq, a); this.s.lerp(this.ts, a);
                }
                o.position.copy(this.p); o.quaternion.copy(this.q); o.scale.copy(this.s);
            }
        });

        // Memainkan animasi dari GLB (dibuat di Blender) langsung lewat THREE.AnimationMixer.
        // Tidak bergantung pada aframe-extras. Jumlah animasi yang ditemukan tampil di teks kuning (anim: ...).
        //   mode: loop = berulang terus | once = main sekali lalu berhenti di pose akhir
        AFRAME.registerComponent('play-anim', {
            schema: { mode: { default: 'loop' } },
            init() {
                this.mixer = null;
                this.el.addEventListener('model-loaded', e => {
                    const T = AFRAME.THREE, model = e.detail.model, clips = (model && model.animations) || [];
                    if (!clips.length) {
                        FXLOG.anim = 'TIDAK ADA animasi di GLB (cek export Blender)';
                        if (window.refreshDbg) window.refreshDbg();
                        return;
                    }
                    this.mixer = new T.AnimationMixer(model);
                    clips.forEach(c => {
                        const a = this.mixer.clipAction(c);
                        if (this.data.mode === 'once') { a.setLoop(T.LoopOnce, 1); a.clampWhenFinished = true; }
                        else a.setLoop(T.LoopRepeat, Infinity);
                        a.reset().play();
                    });
                    FXLOG.anim = clips.length + ' clip (' + clips.map(c => c.name).join(', ') + ') ' + this.data.mode;
                    if (window.refreshDbg) window.refreshDbg();
                });
            },
            tick(t, dt) {
                if (this.mixer) this.mixer.update(Math.min(dt, 100) / 1000);
            },
            remove() {
                if (this.mixer) this.mixer.stopAllAction();
            }
        });

        // Partikel jatuh dari atas ke bawah memakai PNG sendiri
        const texCache = {};
        function loadTex(mode) {
            if (texCache[mode]) return texCache[mode];
            const url = FX_MODES[mode].img + '?v=' + ASSET_VER, T = AFRAME.THREE;
            return texCache[mode] = new Promise(res => {
                new T.TextureLoader().load(url, t => {
                    if (T.SRGBColorSpace) t.colorSpace = T.SRGBColorSpace;
                    res(t);
                }, undefined, () => {
                    FXLOG.msg = 'fx FAILED (' + url + ')';
                    if (window.refreshDbg) window.refreshDbg();
                    res(flakeTex());   // gambar cadangan kalau PNG tidak ketemu
                });
            });
        }

        // Partikel dipasang di KAMERA (overlay layar penuh), muncul hanya saat kartu terdeteksi.
        AFRAME.registerComponent('fall-fx', {
            schema: { mode: { default: 'snow' } },
            init() {
                if (!FX_MODES[this.data.mode]) return;
                this.cam = this.el.sceneEl.camera;
                loadTex(this.data.mode).then(tex => {
                    if (this.removed || !this.cam) return;
                    const T = AFRAME.THREE, P = PARTICLE;
                    const img = tex.image;
                    this.aspect = (img && img.width && img.height) ? img.width / img.height : 1;
                    const baseMat = new T.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, depthTest: false });
                    const group = new T.Group(), flakes = [];
                    const rnd = (a, b) => a + Math.random() * (b - a);
                    for (let i = 0; i < P.count; i++) {
                        const r = Math.pow(Math.random(), P.sizeBias);   // r kecil = butiran kecil
                        const mat = baseMat.clone();
                        mat.rotation = Math.random() * 6.283;
                        const sp = new T.Sprite(mat);
                        sp.renderOrder = 999; sp.frustumCulled = false;
                        flakes.push({
                            sp, mat,
                            u: Math.random(),                              // posisi kiri-kanan layar (0-1)
                            y: rnd(-P.margin, 1 + P.margin),               // posisi tinggi layar (1 = atas), tersebar sejak awal
                            s: P.sizeMin + (P.sizeMax - P.sizeMin) * r,    // ukuran (fraksi tinggi layar)
                            v: P.speedMin + (P.speedMax - P.speedMin) * (0.3 * Math.random() + 0.7 * r),
                            ph: Math.random() * 6.283, f: rnd(0.5, 1.2),
                            sw: 0.5 + r,
                            spin: (Math.random() - 0.5) * 2 * P.spin,
                            op: rnd(P.opacityMin, P.opacityMax)
                        });
                        group.add(sp);
                    }
                    this.flakes = flakes; this.group = group;
                    group.visible = false;
                    this.cam.add(group);
                });
            },
            remove() {
                this.removed = true;
                if (this.group && this.cam) this.cam.remove(this.group);
            },
            tick(t, dt) {
                if (!this.flakes) return;
                const par = this.el.object3D.parent;
                this.group.visible = par.visible;
                if (!par.visible) return;
                const d = par.position.length();               // jarak kartu dari kamera
                const e = this.cam.projectionMatrix.elements;
                if (!(d > 0) || !e[0] || !e[5]) return;
                const hw = Math.abs(d / e[0]), hh = Math.abs(d / e[5]);   // setengah lebar/tinggi layar di jarak itu
                dt = Math.min(dt, 50) / 1000;
                const P = PARTICLE, m = P.margin, range = 1 + 2 * m, ts = t / 1000;
                for (const f of this.flakes) {
                    f.y -= f.v * dt;
                    if (f.y < -m) { f.y = 1 + m; f.u = Math.random(); }
                    const w = (f.y + m) / range;
                    f.mat.opacity = f.op * Math.max(0, Math.min(1, w / P.fade, (1 - w) / P.fade));
                    f.mat.rotation += f.spin * dt;
                    const u = f.u + Math.sin(ts * f.f + f.ph) * P.flutter * f.sw;
                    f.sp.position.set((u - 0.5) * 2 * hw, (f.y - 0.5) * 2 * hh, -d);
                    const h = f.s * 2 * hh;
                    f.sp.scale.set(h * this.aspect, h, 1);
                }
            }
        });

        // Dipasang di holder: partikel sesuai data-fx (snow/night/wood/light)
        function addFx(target, holder) {
            const mode = target.dataset.fx;
            if (FX_MODES[mode]) {
                const fx = document.createElement('a-entity');
                fx.setAttribute('fall-fx', 'mode: ' + mode);
                holder.appendChild(fx);
            }
        }
    </script>

    <script>
        // ===== TESTING: true = tampilkan teks kuning di atas layar, false = sembunyikan =====
        // Untuk user biasa pakai false (lebih ringan). Ubah ke true hanya saat kamu sedang mengecek masalah.
        const DEBUG = false;

        const hint = document.getElementById('hint'), dbg = document.getElementById('dbg'),
            scene = document.querySelector('a-scene');
        dbg.style.display = DEBUG ? '' : 'none';

        let cam = 'loading', card = '', glb = '', mind = 'checking', songMsg = 'menunggu kamera';
        const show = () => {
            if (!DEBUG) return;
            dbg.textContent = 'mind: ' + mind + ' | camera: ' + cam + (card ? ' | card: ' + card : '') +
                (glb ? ' | GLB: ' + glb : '') + (FXLOG.anim ? ' | anim: ' + FXLOG.anim : '') +
                ' | song: ' + songMsg + (FXLOG.msg ? ' | ' + FXLOG.msg : '');
        };
        show();
        window.refreshDbg = show;

        // cek file .mind (hanya saat DEBUG). Memakai URL yang SAMA dengan MindAR & preload, jadi tidak unduh dua kali.
        if (DEBUG) {
            fetch('assets/update.mind').then(r => r.arrayBuffer().then(b => {
                mind = !r.ok ? 'NOT FOUND (' + r.status + ') - cek path/nama file .mind'
                    : b.byteLength < 1000 ? 'INVALID (' + b.byteLength + ' byte)'
                        : 'OK (' + Math.round(b.byteLength / 1024) + ' KB)';
                show();
            })).catch(() => { mind = 'GAGAL diambil'; show(); });
        }

        // ===== LAGU: 1 lagu, autoplay saat kartu spawn, fade in/out, loop crossfade =====
        const SONG = {
            src: 'assets/song.mp3',   // <- GANTI ke nama file lagumu di folder assets
            volume: 0.9,              // 0 - 1
            fadeIn: 1,                // detik: fade in saat kartu terdeteksi
            fadeOut: 1,               // detik: fade out saat kartu hilang
            crossfade: 2              // detik: tumpang tindih akhir lagu dengan awal lagu berikutnya
        };

        let ctx = null, master = null, buf = null, started = false, wantSong = false;

        function rampMaster(to, secs) {
            if (!ctx) return;
            const now = ctx.currentTime;
            master.gain.cancelScheduledValues(now);
            master.gain.setValueAtTime(master.gain.value, now);
            master.gain.linearRampToValueAtTime(to, now + secs);
        }

        // satu "putaran" lagu; putaran berikutnya dijadwalkan mulai crossfade detik sebelum yang ini selesai
        function startLayer(when, first) {
            const dur = buf.duration, X = Math.max(0, Math.min(SONG.crossfade, dur / 2 - 0.5));
            const src = ctx.createBufferSource(); src.buffer = buf;
            const g = ctx.createGain(); src.connect(g); g.connect(master);
            if (first) g.gain.setValueAtTime(1, when);
            else { g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(1, when + X); }
            g.gain.setValueAtTime(1, when + dur - X);
            g.gain.linearRampToValueAtTime(0, when + dur);
            src.start(when); src.stop(when + dur + 0.3);

            const next = when + dur - X;
            setTimeout(() => startLayer(Math.max(next, ctx.currentTime), false),
                Math.max(0, (next - ctx.currentTime - 2) * 1000));
        }

        function beginSong() {
            if (started || !buf) return;
            started = true;
            startLayer(ctx.currentTime + 0.05, true);
        }

        function initSong() {
            if (ctx) return;                       // jangan dobel
            songMsg = 'loading'; show();
            try {
                ctx = new (window.AudioContext || window.webkitAudioContext)();
                master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
                ctx.onstatechange = () => { if (ctx.state === 'running' && wantSong) { songMsg = 'playing'; show(); } };
                fetch(SONG.src + '?v=' + ASSET_VER).then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); })
                    .then(ab => new Promise((ok, no) => ctx.decodeAudioData(ab, ok, no)))
                    .then(b => {
                        buf = b; songMsg = 'ready'; show();
                        if (wantSong) { beginSong(); rampMaster(SONG.volume, SONG.fadeIn); }
                    })
                    .catch(() => { songMsg = 'FAILED (cek ' + SONG.src + ')'; show(); });
            } catch (e) { songMsg = 'tidak didukung'; show(); }
        }

        function playSong() {
            wantSong = true;                       // kalau lagu belum siap, otomatis main begitu siap (lihat initSong)
            if (!ctx) return;
            if (ctx.state !== 'running') ctx.resume().catch(() => { });
            if (buf) { beginSong(); rampMaster(SONG.volume, SONG.fadeIn); }
            songMsg = ctx.state === 'running' ? 'playing' : 'menunggu sentuhan layar'; show();
        }

        function stopSong() {       // fade out, lagu tetap berjalan diam-diam supaya terasa tak terputus
            wantSong = false;
            rampMaster(0, SONG.fadeOut);
        }

        // browser (terutama iPhone) bisa memblokir suara otomatis: sentuhan pertama membukanya tanpa teks apa pun
        ['touchend', 'click'].forEach(ev => document.addEventListener(ev, () => {
            if (ctx && ctx.state !== 'running') ctx.resume().catch(() => { });
        }, { passive: true }));

        // ===== KAMERA DITOLAK / TIDAK BISA DIBUKA =====
        // Alur: MindAR gagal membuka kamera -> event arError -> tampil layar bantuan (#camfix) berisi
        // penjelasan + langkah mengizinkan kamera + tombol "Try again" dan "Back".
        const camfix = document.getElementById('camfix'), cfMsg = document.getElementById('cf-msg'),
            cfSteps = document.getElementById('cf-steps'), cfRetry = document.getElementById('cf-retry'),
            cfCopy = document.getElementById('cf-copy');
        const UA = navigator.userAgent;
        const IS_IOS = /iPad|iPhone|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const IS_ANDROID = /Android/i.test(UA);
        const IN_APP = /FBAN|FBAV|Instagram|Line\/|MicroMessenger|WhatsApp|TikTok|Snapchat|Twitter|Telegram/i.test(UA);

        // Teks yang tampil ke user (bahasa Inggris, sama seperti halaman lain). Ubah di sini kalau mau.
        const CAMFIX_TEXT = {
            denied: 'Camera access is blocked. This experience needs your camera to scan the card.',
            inapp: 'This browser can’t open the camera. Please open this page in Safari or Chrome.',
            nocamera: 'No camera was found on this device.',
            busy: 'The camera is being used by another app. Close it, then try again.',
            insecure: 'The camera needs a secure (https) connection.'
        };
        const CAMFIX_STEPS = {
            ios: ['Tap the “aA” icon in the address bar.', 'Choose Website Settings and set Camera to Allow.', 'Come back here and tap Try again.'],
            android: ['Tap the lock icon next to the address bar.', 'Open Permissions and set Camera to Allow.', 'Come back here and tap Try again.'],
            other: ['Click the camera or lock icon in the address bar.', 'Allow camera access for this site.', 'Then click Try again.'],
            inapp: ['Tap the ⋯ or share menu.', 'Choose “Open in Browser” (Safari or Chrome).']
        };

        function showCamFix(kind) {
            if (IN_APP) kind = 'inapp';
            cfMsg.textContent = CAMFIX_TEXT[kind] || CAMFIX_TEXT.denied;
            let steps = [];
            if (kind === 'denied') steps = IS_IOS ? CAMFIX_STEPS.ios : IS_ANDROID ? CAMFIX_STEPS.android : CAMFIX_STEPS.other;
            else if (kind === 'inapp') steps = CAMFIX_STEPS.inapp;
            cfSteps.innerHTML = '';
            steps.forEach(t => { const li = document.createElement('li'); li.textContent = t; cfSteps.appendChild(li); });
            cfSteps.style.display = steps.length ? '' : 'none';
            cfCopy.style.display = kind === 'inapp' ? '' : 'none';
            cfRetry.style.display = (kind === 'inapp' || kind === 'insecure') ? 'none' : '';
            cfRetry.disabled = false;
            camfix.classList.add('on');
        }

        // Cari tahu penyebabnya tanpa memunculkan permintaan izin baru
        async function detectKind() {
            if (!window.isSecureContext) return 'insecure';
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return 'inapp';
            try {
                const st = await navigator.permissions.query({ name: 'camera' });
                // kalau user mengubah izin lewat pengaturan, otomatis muat ulang
                st.onchange = () => { if (st.state === 'granted') location.reload(); };
            } catch (e) { /* Safari lama: Permissions API untuk kamera tidak ada */ }
            return 'denied';       // paling sering; kalau ternyata bukan, "Try again" menampilkan penyebab sebenarnya
        }

        cfRetry.addEventListener('click', async () => {
            if (IS_IOS) { location.reload(); return; }          // iOS: muat ulang = minta izin lagi
            cfRetry.disabled = true;
            try {
                const s = await navigator.mediaDevices.getUserMedia({ video: true });
                s.getTracks().forEach(t => t.stop());
                location.reload();                              // izin sudah ada -> mulai ulang AR
            } catch (e) {
                const n = e && e.name;
                showCamFix(n === 'NotFoundError' || n === 'OverconstrainedError' ? 'nocamera'
                    : n === 'NotReadableError' || n === 'AbortError' || n === 'TrackStartError' ? 'busy' : 'denied');
            }
        });

        cfCopy.addEventListener('click', () => {
            const done = () => { cfCopy.textContent = 'Link copied'; };
            if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(done).catch(() => { });
        });

        // ===== KAMERA & KARTU =====
        // URUTAN MEMUAT: (1) script + kamera + .mind dulu, (2) BARU setelah kamera siap, lagu dimuat di latar belakang.
        scene.addEventListener('arReady', () => {
            cam = 'OK'; hint.textContent = 'Point the camera at a card'; show();
            setTimeout(initSong, 800);             // beri jeda singkat supaya pelacakan kartu stabil dulu
        });
        scene.addEventListener('arError', async () => {
            cam = 'ERROR'; hint.classList.add('off'); show();
            showCamFix(await detectKind());
        });

        // Model + efek dibuat sekali saat kartunya pertama kali terdeteksi, di dalam holder yang mengikuti kartu dengan halus
        document.querySelectorAll('.tgt').forEach(el => {
            el.addEventListener('targetFound', () => {
                card = el.dataset.name; hint.classList.add('off');
                playSong();
                if (!el.holder) {
                    const holder = document.createElement('a-entity');
                    holder.targetEl = el;
                    holder.setAttribute('smooth-follow', '');
                    el.holder = holder;
                    scene.appendChild(holder);

                    addFx(el, holder);

                    const m = document.createElement('a-gltf-model');
                    m.setAttribute('src', el.dataset.glb + '?v=' + ASSET_VER);
                    m.setAttribute('rotation', el.dataset.rot);
                    m.setAttribute('position', el.dataset.pos);
                    m.setAttribute('scale', el.dataset.scale);
                    const anim = el.dataset.anim || 'loop';
                    if (anim !== 'none') m.setAttribute('play-anim', 'mode: ' + anim);
                    m.addEventListener('model-loaded', () => { glb = 'OK'; show(); });
                    m.addEventListener('model-error', () => { glb = 'FAILED (cek path ' + el.dataset.glb + ')'; show(); });
                    glb = 'loading';
                    holder.appendChild(m);
                }
                show();
            });
            el.addEventListener('targetLost', () => { hint.classList.remove('off'); card = ''; stopSong(); show(); });
        });

        window.addEventListener('error', e => { if (DEBUG) dbg.textContent = 'Error: ' + e.message; });
        window.addEventListener('unhandledrejection', e => { if (DEBUG) dbg.textContent = 'Error: ' + (e.reason && e.reason.message || e.reason); });
    </script>
</body>

</html>
