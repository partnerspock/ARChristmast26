<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow">
    <title>Christmas 2026</title>

    <!-- Hanya 3 script ini. Jangan tambah mindar-image.prod.js atau mindar-image-three.prod.js -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        /* JANGAN kasih background berwarna di html/body: video kamera ada di belakang dan akan tertutup */
        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: system-ui, sans-serif
        }

        #hint {
            position: fixed;
            left: 0;
            right: 0;
            bottom: calc(32px + env(safe-area-inset-bottom, 0px));
            z-index: 10;
            text-align: center;
            color: #fff;
            font-size: 1rem;
            text-shadow: 0 2px 8px rgba(0, 0, 0, .8);
            pointer-events: none;
            padding: 0 24px;
            transition: opacity .3s
        }

        #hint.off {
            opacity: 0
        }

        /* teks kuning untuk testing: tampil/sembunyi diatur lewat DEBUG di script paling bawah */
        #dbg {
            position: fixed;
            top: calc(12px + env(safe-area-inset-top, 0px));
            left: 0;
            right: 0;
            z-index: 10;
            text-align: center;
            color: #ff0;
            font-size: .8rem;
            text-shadow: 0 1px 4px #000;
            pointer-events: none;
            padding: 0 16px
        }
    </style>
</head>

<body>

    <p id="hint">Opening camera...</p>
    <p id="dbg"></p>

    <!--
      SATU file .mind berisi 10 gambar. Urutan upload di compiler = targetIndex:
      char1 -> 0, char2 -> 1, ... char10 -> 9.
      maxTrack: 1 = satu kartu sekali deteksi (lebih ringan). Naikkan kalau mau beberapa kartu sekaligus.
    -->
    <a-scene
        mindar-image="imageTargetSrc: assets/update.mind; maxTrack: 1; filterMinCF: 0.0005; filterBeta: 50; missTolerance: 10; autoStart: true; uiLoading: yes; uiScanning: no; uiError: yes;"
        color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity light="type: ambient; intensity: 1.2"></a-entity>
        <a-entity light="type: directional; intensity: 1.5" position="1 2 3"></a-entity>

        <!-- Satu baris = satu karakter.
             data-scale = UKURAN (kecilkan di sini, mis. 0.8 0.8 0.8)
             data-rot   = rotasi, data-pos = posisi
             data-anim  = loop (gerak terus) | once (main sekali lalu diam di pose akhir) | none (tanpa animasi)
             data-fx    = off (tanpa partikel) | snow | night | wood  (hanya beda GAMBAR, lihat FX_MODES) -->
        <a-entity class="tgt" data-name="char1" data-glb="char1/char1.glb" data-rot="0 0 0" data-pos="0 0 0"
            data-scale="0.8 0.8 0.8" data-anim="once" data-fx="off" mindar-image-target="targetIndex: 0"></a-entity>
        <a-entity class="tgt" data-name="char2" data-glb="char2/char2.glb" data-rot="0 0 0" data-pos="0 0 0"
            data-scale="0.8 0.8 0.8" data-anim="once" data-fx="off" mindar-image-target="targetIndex: 1"></a-entity>
        <a-entity class="tgt" data-name="char3" data-glb="char3/char3.glb" data-rot="0 0 0" data-pos="0 0 0"
            data-scale="0.8 0.8 0.8" data-anim="once" data-fx="off" mindar-image-target="targetIndex: 2"></a-entity>
        <a-entity class="tgt" data-name="char4" data-glb="char4/char4.glb" data-rot="0 0 0" data-pos="0 0 0"
            data-scale="0.8 0.8 0.8" data-anim="once" data-fx="night" mindar-image-target="targetIndex: 3"></a-entity>
        <a-entity class="tgt" data-name="char5" data-glb="char5/char5.glb" data-rot="0 0 0" data-pos="0 0 0"
            data-scale="0.8 0.8 0.8" data-anim="once" data-fx="night" mindar-image-target="targetIndex: 4"></a-entity>
        <a-entity class="tgt" data-name="char6" data-glb="char6/char6.glb" data-rot="0 0 0" data-pos="0 0 0"
            data-scale="0.8 0.8 0.8" data-anim="once" data-fx="night" mindar-image-target="targetIndex: 5"></a-entity>
        <a-entity class="tgt" data-name="char7" data-glb="char7/char7.glb" data-rot="0 0 0" data-pos="0 0 0"
            data-scale="0.8 0.8 0.8" data-anim="once" data-fx="wood" mindar-image-target="targetIndex: 6"></a-entity>
        <a-entity class="tgt" data-name="char8" data-glb="char8/char8.glb" data-rot="0 0 0" data-pos="0 0 0"
            data-scale="0.8 0.8 0.8" data-anim="once" data-fx="wood" mindar-image-target="targetIndex: 7"></a-entity>
        <a-entity class="tgt" data-name="char9" data-glb="char9/char9.glb" data-rot="0 0 0" data-pos="0 0 0"
            data-scale="0.8 0.8 0.8" data-anim="once" data-fx="wood" mindar-image-target="targetIndex: 8"></a-entity>
        <a-entity class="tgt" data-name="char10" data-glb="char10/char10.glb" data-rot="0 0 0" data-pos="0 0 0"
            data-scale="0.8 0.8 0.8" data-anim="once" data-fx="snow" mindar-image-target="targetIndex: 9"></a-entity>
    </a-scene>

    <script>
        // ===== PENGATURAN EFEK: semua angka ada di sini =====
        // Satuan: lebar kartu = 1 unit. Sumbu Z = tegak lurus kartu (naik dari permukaan kartu).

        // Penghalus gerakan: model mengikuti kartu dengan halus, jadi tidak goyang.
        const SMOOTH = {
            on: true,       // false = ikuti kartu apa adanya (seperti sebelumnya)
            slow: 3,        // saat kartu nyaris diam: KECILKAN = makin stabil (mis. 1.5), besarkan = lebih responsif
            fast: 20,       // saat kartu digerakkan: BESARKAN = model lebih cepat menyusul
            range: 0.05     // batas "gerakan kecil" dianggap goyangan
        };

        // Cahaya (glow) untuk semua karakter
        const FX = {
            glowSize: 0.05,           // UKURAN CAHAYA
            glowOpacity: 0.05,        // terang cahaya (0-1)
            glowHeight: 1,            // tinggi cahaya dari kartu
            lightIntensity: 0.05      // seberapa terang model tersorot
        };

        // Gambar per mode: HANYA ini yang beda antar mode. Animasi & setting sama semua.
        // Untuk ganti aset, cukup ubah nama file PNG di sini.
        const FX_MODES = {
            snow: { img: 'assets/snowflake.png' },
            night: { img: 'assets/night.png' },   // <- ganti nama file
            wood: { img: 'assets/wood.png' }      // <- ganti nama file
        };

        // Setting partikel (dipakai SEMUA mode). Satuan: lebar kartu = 1.
        const PARTICLE = {
            count: 60,              // jumlah butiran (turunkan ke 40 kalau HP berat)
            sizeMin: 0.04,          // butiran paling kecil
            sizeMax: 0.22,          // butiran paling besar
            sizeBias: 2.2,          // 1 = rata, makin besar = makin banyak yang kecil, sedikit yang besar
            area: [3.2, 3.2, 1.6],  // [lebar, tinggi, kedalaman] area sebar: besarkan = makin menyebar
            centerY: 0.3,           // geser area ke atas (+) / bawah (-) dari pusat kartu
            speedMin: 0.05,         // kecepatan jatuh paling lambat
            speedMax: 0.14,         // kecepatan jatuh paling cepat (butiran besar cenderung lebih cepat)
            flutter: 0.15,          // goyangan kiri-kanan
            spin: 0.6,              // kecepatan berputar (0 = tidak berputar)
            fade: 0.2,              // bagian atas/bawah area untuk fade in/out (0-0.5)
            opacityMin: 0.6,        // transparansi terendah
            opacityMax: 1           // transparansi tertinggi
        };
        const FXLOG = { msg: '' };

        function radialTex(stops) {
            const c = document.createElement('canvas'); c.width = c.height = 128;
            const x = c.getContext('2d'), g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
            stops.forEach(s => g.addColorStop(s[0], s[1]));
            x.fillStyle = g; x.fillRect(0, 0, 128, 128);
            return new AFRAME.THREE.CanvasTexture(c);
        }

        function flakeTex() {
            const c = document.createElement('canvas'); c.width = c.height = 64;
            const x = c.getContext('2d'), g = x.createRadialGradient(32, 32, 2, 32, 32, 30);
            g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.6, 'rgba(255,255,255,1)');
            g.addColorStop(.8, 'rgba(150,190,255,.9)'); g.addColorStop(1, 'rgba(150,190,255,0)');
            x.fillStyle = g; x.beginPath(); x.arc(32, 32, 30, 0, 6.2832); x.fill();
            return new AFRAME.THREE.CanvasTexture(c);
        }

        // Holder mengikuti kartu dengan penghalus: gerakan kecil (goyangan tracking) diredam,
        // gerakan besar (HP/kartu digeser) tetap diikuti.
        AFRAME.registerComponent('smooth-follow', {
            init() {
                const T = AFRAME.THREE;
                this.src = this.el.targetEl.object3D;
                this.p = new T.Vector3(); this.q = new T.Quaternion(); this.s = new T.Vector3(1, 1, 1);
                this.tp = new T.Vector3(); this.tq = new T.Quaternion(); this.ts = new T.Vector3(1, 1, 1);
                this.ready = false;
                this.el.object3D.visible = false;
            },
            tick(t, dt) {
                const o = this.el.object3D, src = this.src;
                o.visible = src.visible;
                if (!src.visible) { this.ready = false; return; }
                src.matrix.decompose(this.tp, this.tq, this.ts);
                if (!this.ready || !SMOOTH.on) {
                    this.p.copy(this.tp); this.q.copy(this.tq); this.s.copy(this.ts); this.ready = true;
                } else {
                    dt = Math.min(dt, 100) / 1000;
                    const ang = 2 * Math.acos(Math.min(1, Math.abs(this.q.dot(this.tq))));
                    const d = this.p.distanceTo(this.tp) + ang * 0.3;
                    const k = SMOOTH.slow + (SMOOTH.fast - SMOOTH.slow) * Math.min(1, d / SMOOTH.range);
                    const a = 1 - Math.exp(-k * dt);
                    this.p.lerp(this.tp, a); this.q.slerp(this.tq, a); this.s.lerp(this.ts, a);
                }
                o.position.copy(this.p); o.quaternion.copy(this.q); o.scale.copy(this.s);
            }
        });

        // Partikel jatuh dari atas ke bawah memakai PNG sendiri
        const texCache = {};
        function loadTex(mode) {
            if (texCache[mode]) return texCache[mode];
            const url = FX_MODES[mode].img, T = AFRAME.THREE;
            return texCache[mode] = new Promise(res => {
                new T.TextureLoader().load(url, t => {
                    if (T.SRGBColorSpace) t.colorSpace = T.SRGBColorSpace;
                    res(t);
                }, undefined, () => {
                    FXLOG.msg = 'fx FAILED (' + url + ')';
                    if (window.refreshDbg) window.refreshDbg();
                    res(flakeTex());   // gambar cadangan kalau PNG tidak ketemu
                });
            });
        }

        AFRAME.registerComponent('fall-fx', {
            schema: { mode: { default: 'snow' } },
            init() {
                const T = AFRAME.THREE;
                if (!FX_MODES[this.data.mode]) return;
                this.inv = new T.Quaternion(); this.tmp = new T.Vector3();
                loadTex(this.data.mode).then(tex => {
                    const P = PARTICLE, A = P.area;
                    const img = tex.image, aspect = (img && img.width && img.height) ? img.width / img.height : 1;
                    const baseMat = new T.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
                    const group = new T.Group(), flakes = [];
                    const rnd = (a, b) => a + Math.random() * (b - a);

                    for (let i = 0; i < P.count; i++) {
                        // r kecil = butiran kecil; pow bikin lebih banyak yang kecil, sedikit yang besar
                        const r = Math.pow(Math.random(), P.sizeBias);
                        const s = P.sizeMin + (P.sizeMax - P.sizeMin) * r;
                        const mat = baseMat.clone();                    // material sendiri agar bisa fade per butiran
                        const sp = new T.Sprite(mat);
                        sp.scale.set(s * aspect, s, 1);
                        mat.rotation = Math.random() * 6.283;
                        flakes.push({
                            sp, mat,
                            bx: rnd(-A[0] / 2, A[0] / 2),
                            y: P.centerY + rnd(-A[1] / 2, A[1] / 2),    // tersebar merata di tinggi area sejak awal
                            bz: rnd(-A[2] * 0.3, A[2] * 0.7),
                            v: P.speedMin + (P.speedMax - P.speedMin) * (0.3 * Math.random() + 0.7 * r),
                            ph: Math.random() * 6.283, f: rnd(0.5, 1.2),
                            sw: 0.5 + r,                                // butiran besar goyang lebih lebar
                            spin: (Math.random() - 0.5) * 2 * P.spin,
                            op: rnd(P.opacityMin, P.opacityMax)
                        });
                        group.add(sp);
                    }
                    this.flakes = flakes;
                    this.el.setObject3D('fall', group);
                });
            },
            tick(t, dt) {
                if (!this.flakes) return;
                dt = Math.min(dt, 50) / 1000;
                const P = PARTICLE, A = P.area, ts = t / 1000, par = this.el.object3D.parent;
                const top = P.centerY + A[1] / 2, bottom = P.centerY - A[1] / 2, H = A[1];
                this.inv.copy(par.quaternion).invert();     // putar balik arah kartu -> arah layar
                const sc = par.scale.x || 1;
                for (const f of this.flakes) {
                    const a = ts * f.f + f.ph;
                    f.y -= f.v * dt;
                    if (f.y < bottom) {                      // keluar di bawah -> muncul lagi dari atas, posisi acak
                        f.y = top;
                        f.bx = (Math.random() - .5) * A[0];
                        f.bz = -A[2] * 0.3 + Math.random() * A[2];
                    }
                    // fade in di atas, fade out di bawah
                    const u = (f.y - bottom) / H;
                    const edge = Math.min(1, u / P.fade, (1 - u) / P.fade);
                    f.mat.opacity = f.op * Math.max(0, edge);
                    f.mat.rotation += f.spin * dt;
                    const fl = P.flutter * f.sw;
                    this.tmp.set(f.bx + Math.sin(a) * fl, f.y, f.bz + Math.sin(a * 2) * fl * 0.5)
                        .applyQuaternion(this.inv).divideScalar(sc);
                    f.sp.position.copy(this.tmp);
                }
            }
        });

        // Cahaya lembut berdenyut
        AFRAME.registerComponent('glow-fx', {
            init() {
                const T = AFRAME.THREE;
                this.spr = new T.Sprite(new T.SpriteMaterial({
                    map: radialTex([[0, 'rgba(255,255,255,1)'], [.35, 'rgba(255,240,190,.55)'], [1, 'rgba(255,220,150,0)']]),
                    color: new T.Color('#ffe9a8'), blending: T.AdditiveBlending, transparent: true, depthWrite: false
                }));
                this.el.setObject3D('glow', this.spr);
            },
            tick(t) {
                if (!this.spr) return;
                const k = Math.sin(t / 450), s = FX.glowSize * (1 + 0.06 * k);
                this.spr.material.opacity = Math.min(1, FX.glowOpacity + 0.2 * k);
                this.spr.scale.set(s, s, 1);
            }
        });

        // Dipasang di holder: partikel sesuai data-fx (snow/night/wood), cahaya untuk semua
        function addFx(target, holder) {
            const mode = target.dataset.fx;
            if (FX_MODES[mode]) {
                const fx = document.createElement('a-entity');
                fx.setAttribute('fall-fx', 'mode: ' + mode);
                holder.appendChild(fx);
            }
            const glow = document.createElement('a-entity');
            glow.setAttribute('glow-fx', '');
            glow.setAttribute('position', '0 0 ' + FX.glowHeight);
            glow.setAttribute('light', 'type: point; color: #fff1c2; intensity: ' + FX.lightIntensity + '; decay: 2');
            holder.appendChild(glow);
        }
    </script>

    <script>
        // ===== TESTING: true = tampilkan teks kuning di atas layar, false = sembunyikan =====
        const DEBUG = true;

        const hint = document.getElementById('hint'), dbg = document.getElementById('dbg'),
            scene = document.querySelector('a-scene');
        dbg.style.display = DEBUG ? '' : 'none';

        let cam = 'loading', card = '', glb = '', mind = 'checking', songMsg = 'loading';
        const show = () => {
            if (!DEBUG) return;
            dbg.textContent = 'mind: ' + mind + ' | camera: ' + cam + (card ? ' | card: ' + card : '') +
                (glb ? ' | GLB: ' + glb : '') + ' | song: ' + songMsg + (FXLOG.msg ? ' | ' + FXLOG.msg : '');
        };
        show();
        window.refreshDbg = show;

        // cek file .mind (hanya saat DEBUG): harus ada dan berukuran besar, bukan halaman 404 kecil
        if (DEBUG) {
            fetch('assets/update.mind').then(r => r.arrayBuffer().then(b => {
                mind = !r.ok ? 'NOT FOUND (' + r.status + ') - cek path/nama file .mind'
                    : b.byteLength < 1000 ? 'INVALID (' + b.byteLength + ' byte)'
                        : 'OK (' + Math.round(b.byteLength / 1024) + ' KB)';
                show();
            })).catch(() => { mind = 'GAGAL diambil'; show(); });
        }

        // ===== LAGU: 1 lagu, autoplay saat kartu spawn, fade in/out, loop crossfade =====
        const SONG = {
            src: 'assets/song.mp3',   // <- GANTI ke nama file lagumu di folder assets
            volume: 0.9,              // 0 - 1
            fadeIn: 1,                // detik: fade in saat kartu terdeteksi
            fadeOut: 1,               // detik: fade out saat kartu hilang
            crossfade: 2              // detik: tumpang tindih akhir lagu dengan awal lagu berikutnya
        };

        let ctx = null, master = null, buf = null, started = false, wantSong = false;

        function rampMaster(to, secs) {
            if (!ctx) return;
            const now = ctx.currentTime;
            master.gain.cancelScheduledValues(now);
            master.gain.setValueAtTime(master.gain.value, now);
            master.gain.linearRampToValueAtTime(to, now + secs);
        }

        // satu "putaran" lagu; putaran berikutnya dijadwalkan mulai crossfade detik sebelum yang ini selesai
        function startLayer(when, first) {
            const dur = buf.duration, X = Math.max(0, Math.min(SONG.crossfade, dur / 2 - 0.5));
            const src = ctx.createBufferSource(); src.buffer = buf;
            const g = ctx.createGain(); src.connect(g); g.connect(master);
            if (first) g.gain.setValueAtTime(1, when);
            else { g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(1, when + X); }
            g.gain.setValueAtTime(1, when + dur - X);
            g.gain.linearRampToValueAtTime(0, when + dur);
            src.start(when); src.stop(when + dur + 0.3);

            const next = when + dur - X;
            setTimeout(() => startLayer(Math.max(next, ctx.currentTime), false),
                Math.max(0, (next - ctx.currentTime - 2) * 1000));
        }

        function beginSong() {
            if (started || !buf) return;
            started = true;
            startLayer(ctx.currentTime + 0.05, true);
        }

        function initSong() {
            try {
                ctx = new (window.AudioContext || window.webkitAudioContext)();
                master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
                ctx.onstatechange = () => { if (ctx.state === 'running' && wantSong) { songMsg = 'playing'; show(); } };
                fetch(SONG.src).then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); })
                    .then(ab => new Promise((ok, no) => ctx.decodeAudioData(ab, ok, no)))
                    .then(b => {
                        buf = b; songMsg = 'ready'; show();
                        if (wantSong) { beginSong(); rampMaster(SONG.volume, SONG.fadeIn); }
                    })
                    .catch(() => { songMsg = 'FAILED (cek ' + SONG.src + ')'; show(); });
            } catch (e) { songMsg = 'tidak didukung'; show(); }
        }

        function playSong() {
            wantSong = true;
            if (!ctx) return;
            if (ctx.state !== 'running') ctx.resume().catch(() => { });
            if (buf) { beginSong(); rampMaster(SONG.volume, SONG.fadeIn); }
            songMsg = ctx.state === 'running' ? 'playing' : 'menunggu sentuhan layar'; show();
        }

        function stopSong() {       // fade out, lagu tetap berjalan diam-diam supaya terasa tak terputus
            wantSong = false;
            rampMaster(0, SONG.fadeOut);
        }

        initSong();
        // browser (terutama iPhone) bisa memblokir suara otomatis: sentuhan pertama membukanya tanpa teks apa pun
        ['touchend', 'click'].forEach(ev => document.addEventListener(ev, () => {
            if (ctx && ctx.state !== 'running') ctx.resume().catch(() => { });
        }, { passive: true }));

        // ===== KAMERA & KARTU =====
        scene.addEventListener('arReady', () => { cam = 'OK'; hint.textContent = 'Point the camera at a card'; show(); });
        scene.addEventListener('arError', () => {
            cam = 'ERROR';
            hint.textContent = 'Camera failed to open. Open in Safari/Chrome and allow camera access.';
            hint.classList.remove('off'); show();
        });

        // Model + efek dibuat sekali saat kartunya pertama kali terdeteksi, di dalam holder yang mengikuti kartu dengan halus
        document.querySelectorAll('.tgt').forEach(el => {
            el.addEventListener('targetFound', () => {
                card = el.dataset.name; hint.classList.add('off');
                playSong();
                if (!el.holder) {
                    const holder = document.createElement('a-entity');
                    holder.targetEl = el;
                    holder.setAttribute('smooth-follow', '');
                    el.holder = holder;
                    scene.appendChild(holder);

                    addFx(el, holder);

                    const m = document.createElement('a-gltf-model');
                    m.setAttribute('src', el.dataset.glb);
                    m.setAttribute('rotation', el.dataset.rot);
                    m.setAttribute('position', el.dataset.pos);
                    m.setAttribute('scale', el.dataset.scale);
                    const anim = el.dataset.anim || 'loop';
                    if (anim === 'loop') m.setAttribute('animation-mixer', '');
                    else if (anim === 'once') m.setAttribute('animation-mixer', 'loop: once; clampWhenFinished: true');
                    m.addEventListener('model-loaded', () => { glb = 'OK'; show(); });
                    m.addEventListener('model-error', () => { glb = 'FAILED (cek path ' + el.dataset.glb + ')'; show(); });
                    glb = 'loading';
                    holder.appendChild(m);
                }
                show();
            });
            el.addEventListener('targetLost', () => { hint.classList.remove('off'); card = ''; stopSong(); show(); });
        });

        window.addEventListener('error', e => { if (DEBUG) dbg.textContent = 'Error: ' + e.message; });
        window.addEventListener('unhandledrejection', e => { if (DEBUG) dbg.textContent = 'Error: ' + (e.reason && e.reason.message || e.reason); });
    </script>
</body>

</html>
