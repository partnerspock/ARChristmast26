<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow">
    <title>Christmas 2026</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: system-ui, sans-serif
        }

        #hint {
            position: fixed;
            left: 0;
            right: 0;
            bottom: calc(32px + env(safe-area-inset-bottom, 0px));
            z-index: 10;
            text-align: center;
            color: #fff;
            font-size: 1rem;
            text-shadow: 0 2px 8px rgba(0, 0, 0, .8);
            pointer-events: none;
            padding: 0 24px;
            transition: opacity .3s
        }

        #hint.off {
            opacity: 0
        }
    </style>
</head>

<body>

    <p id="hint">Arahkan kamera ke kartu</p>

    <!-- imageTargetSrc = hasil compile gambar kartu ini -->
    <a-scene mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiLoading: yes; uiScanning: no; uiError: yes;"
        color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets>
            <a-asset-item id="model" src="./char5.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity light="type: ambient; intensity: 1.2"></a-entity>
        <a-entity light="type: directional; intensity: 1.5" position="1 2 3"></a-entity>

        <a-entity id="target" mindar-image-target="targetIndex: 0">
            <!-- rotation: kalau model tergeletak ganti ke "0 0 0"; scale: perbesar/kecilkan; position z: tinggi di atas kartu -->
            <a-gltf-model src="#model" rotation="90 0 0" position="0 0 0" scale="0.5 0.5 0.5"
                animation-mixer></a-gltf-model>
        </a-entity>
    </a-scene>

    <script>
        const hint = document.getElementById('hint'), t = document.getElementById('target');
        t.addEventListener('targetFound', () => hint.classList.add('off'));
        t.addEventListener('targetLost', () => hint.classList.remove('off'));
    </script>
</body>

</html>
