<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow">
    <title>Christmas 2026</title>

    <!-- Hanya 3 script ini. Jangan tambah mindar-image.prod.js atau mindar-image-three.prod.js -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        /* JANGAN kasih background berwarna di html/body: video kamera ada di belakang dan akan tertutup */
        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: system-ui, sans-serif
        }

        #hint {
            position: fixed;
            left: 0;
            right: 0;
            bottom: calc(32px + env(safe-area-inset-bottom, 0px));
            z-index: 10;
            text-align: center;
            color: #fff;
            font-size: 1rem;
            text-shadow: 0 2px 8px rgba(0, 0, 0, .8);
            pointer-events: none;
            padding: 0 24px;
            transition: opacity .3s
        }

        #hint.off {
            opacity: 0
        }

        /* status debug, hapus elemen #dbg dan bagian scriptnya kalau sudah beres */
        #dbg {
            position: fixed;
            top: calc(12px + env(safe-area-inset-top, 0px));
            left: 0;
            right: 0;
            z-index: 10;
            text-align: center;
            color: #ff0;
            font-size: .8rem;
            text-shadow: 0 1px 4px #000;
            pointer-events: none;
            padding: 0 16px
        }
    </style>
</head>

<body>

    <p id="hint">Opening camera...</p>
    <p id="dbg"></p>

    <!--
      SATU file targets.mind berisi 9 gambar. Urutan upload di compiler = targetIndex:
      char1 -> 0, char2 -> 1, ... char9 -> 8.
      maxTrack: 1 = satu kartu sekali deteksi (lebih ringan). Naikkan kalau mau beberapa kartu sekaligus.
    -->
    <a-scene
        mindar-image="imageTargetSrc: assets/update.mind; maxTrack: 1; filterMinCF: 0.0005; filterBeta: 50; missTolerance: 10; autoStart: true; uiLoading: yes; uiScanning: no; uiError: yes;"
        color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity light="type: ambient; intensity: 1.2"></a-entity>
        <a-entity light="type: directional; intensity: 1.5" position="1 2 3"></a-entity>

        <!-- Satu baris = satu karakter.
             data-scale = UKURAN (kecilkan di sini, mis. 0.8 0.8 0.8)
             data-rot   = rotasi, data-pos = posisi
             data-anim  = loop (gerak terus) | once (main sekali lalu diam di pose akhir) | none (tanpa animasi) -->
        <a-entity class="tgt" data-name="char1" data-glb="char1/char1.glb" data-rot="0 0 0" data-pos="0 0 0"
            data-scale="1.2 1.2 1.2" data-anim="once" mindar-image-target="targetIndex: 0"></a-entity>
        <a-entity class="tgt" data-name="char2" data-glb="char2/char2.glb" data-rot="45 0 0" data-pos="0 0 0"
            data-scale="1.2 1.2 1.2" data-anim="once" mindar-image-target="targetIndex: 1"></a-entity>
        <a-entity class="tgt" data-name="char3" data-glb="char3/char3.glb" data-rot="0 0 0" data-pos="0 0 0"
            data-scale="1.2 1.2 1.2" data-anim="once" mindar-image-target="targetIndex: 2"></a-entity>
        <a-entity class="tgt" data-name="char4" data-glb="char4/char4.glb" data-rot="45 0 0" data-pos="0 0 0"
            data-scale="1.2 1.2 1.2" data-anim="once" mindar-image-target="targetIndex: 3"></a-entity>
        <a-entity class="tgt" data-name="char5" data-glb="char5/char5.glb" data-rot="45 0 0" data-pos="0 0 0"
            data-scale="1.2 1.2 1.2" data-anim="once" mindar-image-target="targetIndex: 4"></a-entity>
        <a-entity class="tgt" data-name="char6" data-glb="char6/char6.glb" data-rot="45 0 0" data-pos="0 0 0"
            data-scale="1.2 1.2 1.2" data-anim="once" mindar-image-target="targetIndex: 5"></a-entity>
        <a-entity class="tgt" data-name="char7" data-glb="char7/char7.glb" data-rot="45 0 0" data-pos="0 0 0"
            data-scale="1.2 1.2 1.2" data-anim="once" mindar-image-target="targetIndex: 6"></a-entity>
        <a-entity class="tgt" data-name="char8" data-glb="char8/char8.glb" data-rot="45 0 0" data-pos="0 0 0"
            data-scale="1.2 1.2 1.2" data-anim="once" mindar-image-target="targetIndex: 7"></a-entity>
        <a-entity class="tgt" data-name="char9" data-glb="char9/char9.glb" data-rot="45 0 0" data-pos="0 0 0"
            data-scale="1.2 1.2 1.2" data-anim="once" mindar-image-target="targetIndex: 8"></a-entity>
        <a-entity class="tgt" data-name="char10" data-glb="char10/char10.glb" data-rot="45 0 0" data-pos="0 0 0"
            data-scale="1.2 1.2 1.2" data-anim="once" mindar-image-target="targetIndex: 9"></a-entity>
    </a-scene>

    <script>
        // ===== EFEK SALJU + CAHAYA: semua pengaturan ada di sini =====
        // Satuan: lebar kartu = 1 unit. Sumbu Z = tegak lurus kartu (naik dari permukaan kartu).
        const FX = {
            snowCount: 100,          // jumlah butiran (50-150, turunkan kalau HP berat)
            flake: 0.07,             // ukuran butiran rata-rata (naikkan kalau kurang kelihatan)
            area: [1.6, 2.0, 1.4],   // lebar, tinggi, dan tinggi jatuh dari kartu
            speed: 0.18,             // kecepatan jatuh
            flutter: 0.12,           // goyangan kiri-kanan
            glowSize: 0.9,           // UKURAN CAHAYA (kecilkan/besarkan di sini)
            glowOpacity: 0.55,       // terang cahaya (0-1)
            glowHeight: 0.5,         // tinggi cahaya dari kartu
            lightIntensity: 2        // seberapa terang model tersorot
        };

        function radialTex(stops) {
            const c = document.createElement('canvas'); c.width = c.height = 128;
            const x = c.getContext('2d'), g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
            stops.forEach(s => g.addColorStop(s[0], s[1]));
            x.fillStyle = g; x.fillRect(0, 0, 128, 128);
            return new AFRAME.THREE.CanvasTexture(c);
        }

        // Butiran: inti putih + tepi kebiruan, supaya terlihat di latar terang
        function flakeTex() {
            const c = document.createElement('canvas'); c.width = c.height = 64;
            const x = c.getContext('2d'), g = x.createRadialGradient(32, 32, 2, 32, 32, 30);
            g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.6, 'rgba(255,255,255,1)');
            g.addColorStop(.8, 'rgba(150,190,255,.9)'); g.addColorStop(1, 'rgba(150,190,255,0)');
            x.fillStyle = g; x.beginPath(); x.arc(32, 32, 30, 0, 6.2832); x.fill();
            return new AFRAME.THREE.CanvasTexture(c);
        }

        // Salju: sprite kecil, jatuh pelan ke kartu, goyang pola angka delapan, ulang dari atas
        AFRAME.registerComponent('snow-fx', {
            init() {
                const T = AFRAME.THREE, A = FX.area;
                const mat = new T.SpriteMaterial({ map: flakeTex(), transparent: true, depthWrite: false });
                this.group = new T.Group(); this.flakes = [];
                for (let i = 0; i < FX.snowCount; i++) {
                    const sp = new T.Sprite(mat), s = FX.flake * (0.6 + Math.random() * 0.8);
                    sp.scale.set(s, s, 1);
                    const bx = (Math.random() - .5) * A[0], by = (Math.random() - .5) * A[1];
                    sp.position.set(bx, by, Math.random() * A[2]);
                    this.flakes.push({ sp, bx, by, v: FX.speed * (.6 + Math.random() * .8), ph: Math.random() * 6.283, f: .6 + Math.random() * .8 });
                    this.group.add(sp);
                }
                this.el.setObject3D('snow', this.group);
            },
            tick(t, dt) {
                if (!this.flakes) return;
                dt = Math.min(dt, 50) / 1000;
                const A = FX.area, ts = t / 1000;
                for (const f of this.flakes) {
                    const p = f.sp.position, a = ts * f.f + f.ph;
                    p.z -= f.v * dt;
                    p.x = f.bx + Math.sin(a) * FX.flutter;
                    p.y = f.by + Math.sin(a * 2) * FX.flutter * 0.5;
                    if (p.z < 0) { p.z = A[2]; f.bx = (Math.random() - .5) * A[0]; f.by = (Math.random() - .5) * A[1]; }
                }
            }
        });

        // Cahaya lembut berdenyut
        AFRAME.registerComponent('glow-fx', {
            init() {
                const T = AFRAME.THREE;
                this.spr = new T.Sprite(new T.SpriteMaterial({
                    map: radialTex([[0, 'rgba(255,255,255,1)'], [.35, 'rgba(255,240,190,.55)'], [1, 'rgba(255,220,150,0)']]),
                    color: new T.Color('#ffe9a8'), blending: T.AdditiveBlending, transparent: true, depthWrite: false
                }));
                this.el.setObject3D('glow', this.spr);
            },
            tick(t) {
                if (!this.spr) return;
                const k = Math.sin(t / 450), s = FX.glowSize * (1 + 0.06 * k);
                this.spr.material.opacity = Math.min(1, FX.glowOpacity + 0.2 * k);
                this.spr.scale.set(s, s, 1);
            }
        });

        // Dipasang sekali per kartu saat pertama kali terdeteksi
        function addFx(target) {
            if (target.querySelector('[snow-fx]')) return;
            const snow = document.createElement('a-entity');
            snow.setAttribute('snow-fx', '');
            target.appendChild(snow);

            const glow = document.createElement('a-entity');
            glow.setAttribute('glow-fx', '');
            glow.setAttribute('position', '0 0 ' + FX.glowHeight);
            glow.setAttribute('light', 'type: point; color: #fff1c2; intensity: ' + FX.lightIntensity + '; decay: 2');
            target.appendChild(glow);
        }
    </script>

    <script>
        const hint = document.getElementById('hint'), dbg = document.getElementById('dbg'),
            scene = document.querySelector('a-scene');

        let cam = 'loading', card = '', glb = '', mind = 'checking';
        const show = () => dbg.textContent = 'mind: ' + mind + ' | camera: ' + cam + (card ? ' | card: ' + card : '') + (glb ? ' | GLB: ' + glb : '');
        show();

        // cek file .mind: harus ada dan berukuran besar (bukan halaman 404 yang cuma ~79 byte)
        fetch('assets/update.mind').then(r => r.arrayBuffer().then(b => {
            mind = !r.ok ? 'NOT FOUND (' + r.status + ') - cek path/nama file .mind'
                : b.byteLength < 1000 ? 'INVALID (' + b.byteLength + ' byte)'
                    : 'OK (' + Math.round(b.byteLength / 1024) + ' KB)';
            show();
        })).catch(() => { mind = 'GAGAL diambil'; show(); });

        scene.addEventListener('arReady', () => { cam = 'OK'; hint.textContent = 'Point the camera at a card'; show(); });
        scene.addEventListener('arError', () => {
            cam = 'ERROR';
            hint.textContent = 'Camera failed to open. Open in Safari/Chrome and allow camera access.';
            hint.classList.remove('off'); show();
        });

        // GLB baru dimuat saat kartunya pertama kali terdeteksi, lalu dipakai ulang
        document.querySelectorAll('.tgt').forEach(el => {
            el.addEventListener('targetFound', () => {
                card = el.dataset.name; hint.classList.add('off');
                addFx(el);
                if (!el.querySelector('a-gltf-model')) {
                    const m = document.createElement('a-gltf-model');
                    m.setAttribute('src', el.dataset.glb);
                    m.setAttribute('rotation', el.dataset.rot);
                    m.setAttribute('position', el.dataset.pos);
                    m.setAttribute('scale', el.dataset.scale);
                    const anim = el.dataset.anim || 'loop';
                    if (anim === 'loop') m.setAttribute('animation-mixer', '');
                    else if (anim === 'once') m.setAttribute('animation-mixer', 'loop: once; clampWhenFinished: true');
                    m.addEventListener('model-loaded', () => { glb = 'OK'; show(); });
                    m.addEventListener('model-error', () => { glb = 'FAILED (cek path ' + el.dataset.glb + ')'; show(); });
                    glb = 'loading';
                    el.appendChild(m);
                }
                show();
            });
            el.addEventListener('targetLost', () => { hint.classList.remove('off'); card = ''; show(); });
        });

        window.addEventListener('error', e => { dbg.textContent = 'Error: ' + e.message; });
        window.addEventListener('unhandledrejection', e => { dbg.textContent = 'Error: ' + (e.reason && e.reason.message || e.reason); });
    </script>
</body>

</html>
