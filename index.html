<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1a4a9c">
    <meta name="robots" content="noindex,nofollow">
    <title>Welcome to Christmas 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --blue: #1a4a9c;
            --deep: #12336f;
            --yellow: #ffcb05
        }

        * {
            box-sizing: border-box;
            margin: 0
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Nunito', system-ui, sans-serif;
            color: #fff;
            background: var(--deep)
        }

        .swirl {
            position: fixed;
            inset: -30%;
            z-index: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, .55) 0, transparent 28%),
                conic-gradient(from 0deg at 50% 50%, #1b4aa8, #8fa8dc, #1b3f94, #c9d8f5, #2a5cc0, #7f9bd6, #1b4aa8);
            filter: blur(28px);
            animation: spin 40s linear infinite;
            will-change: transform
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        .frame {
            position: fixed;
            inset: 0;
            z-index: 1;
            border: 10px solid var(--blue);
            border-radius: 26px;
            pointer-events: none
        }

        main {
            position: relative;
            z-index: 2;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(12px, 3dvh, 24px);
            padding: calc(28px + env(safe-area-inset-top, 0px)) 24px calc(28px + env(safe-area-inset-bottom, 0px));
            text-align: center
        }

        .welcome {
            font-size: 1.05rem;
            text-shadow: 0 2px 6px rgba(0, 0, 0, .4)
        }

        h1 {
            font-family: 'Luckiest Guy', Impact, sans-serif;
            font-weight: 400;
            font-size: clamp(2.8rem, 16vw, 6rem);
            line-height: .95;
            color: var(--yellow);
            -webkit-text-stroke: 7px var(--blue);
            paint-order: stroke fill;
            text-shadow: 0 6px 0 var(--deep)
        }

        .ball {
            width: min(40vw, 34dvh, 180px);
            cursor: pointer;
            background: none;
            border: 0;
            padding: 0;
            animation: bob 2.4s ease-in-out infinite;
            filter: drop-shadow(0 12px 14px rgba(0, 0, 0, .45))
        }

        .ball img {
            width: 100%;
            display: block
        }

        @keyframes bob {
            50% {
                transform: translateY(-10px) rotate(-4deg)
            }
        }

        .scan {
            font-family: 'Luckiest Guy', Impact, sans-serif;
            font-size: 1.5rem;
            letter-spacing: .05em;
            color: var(--blue);
            background: var(--yellow);
            border: 4px solid var(--blue);
            border-radius: 999px;
            min-height: 56px;
            padding: 10px 52px;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--deep)
        }

        .scan:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--deep)
        }

        .hint {
            font-size: 1.05rem;
            text-shadow: 0 2px 6px rgba(0, 0, 0, .5)
        }

        #scanner {
            position: fixed;
            inset: 0;
            z-index: 5;
            background: rgba(10, 25, 60, .95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 20px
        }

        #scanner.on {
            display: flex
        }

        #reader {
            width: min(92vw, 420px);
            border-radius: 20px;
            overflow: hidden;
            border: 6px solid var(--yellow)
        }

        #msg {
            min-height: 2.6em;
            font-size: .95rem;
            text-align: center;
            max-width: 32ch
        }

        .close {
            background: none;
            border: 2px solid #fff;
            color: #fff;
            border-radius: 999px;
            min-height: 48px;
            padding: 8px 32px;
            font: inherit;
            cursor: pointer
        }

        @media (prefers-reduced-motion:reduce) {

            .swirl,
            .ball {
                animation: none
            }
        }
    </style>
</head>

<body>
    <div class="swirl"></div>
    <div class="frame"></div>

    <main>
        <p class="welcome">Welcome to</p>
        <h1>Christmas<br>2026</h1>
        <button class="ball" onclick="openScan()" aria-label="Scan"><img src="assets/pokeball.png" alt=""></button>
        <button class="scan" onclick="openScan()">Scan</button>
        <p class="hint">Scan the QR to reveal</p>
    </main>

    <div id="scanner">
        <div id="reader"></div>
        <p id="msg">Arahkan kamera ke QR di kartu</p>
        <button class="close" onclick="closeScan()">Tutup</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script>
        let qr = null, busy = false;
        const msg = document.getElementById('msg');

        async function openScan() {
            document.getElementById('scanner').classList.add('on');
            msg.textContent = 'Arahkan kamera ke QR di kartu';
            try {
                qr = new Html5Qrcode('reader');
                await qr.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 230, height: 230 } }, onScan, () => { });
            } catch (e) {
                msg.textContent = 'Kamera tidak bisa dibuka. Izinkan akses kamera di browser.';
            }
        }

        function onScan(text) {
            if (busy) return;
            try {
                const u = new URL(text, location.href);
                if (u.origin !== location.origin) { msg.textContent = 'QR ini bukan dari kartu Christmas 2026.'; return; }
                busy = true;
                location.href = u.href;
            } catch (e) { msg.textContent = 'QR tidak dikenali.'; }
        }

        async function closeScan() {
            try { if (qr) { await qr.stop(); qr.clear(); } } catch (e) { }
            qr = null; busy = false;
            document.getElementById('scanner').classList.remove('on');
        }
    </script>
</body>

</html>
