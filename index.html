<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    <title>WebAR dengan Tombol Start</title>

    <!-- Memuat A-Frame dan AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/a3.js/build/ar.js"></script>

    <style>
        /* Styling untuk Layar Pembuka / Tombol Start */
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 15, 15, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            text-align: center;
            padding: 20px;
        }

        #start-btn {
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: background 0.2s;
        }

        #start-btn:hover {
            background-color: #1d4ed8;
        }

        /* Container AR disembunyikan dulu sebelum tombol diklik */
        #ar-container {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
        }
    </style>
</head>

<body style="margin: 0; overflow: hidden;">

    <!-- TAMPILAN AWAL: Tombol untuk Memicu Permission & Start -->
    <div id="start-screen">
        <h2>Simulasi WebAR</h2>
        <p style="max-width: 400px; color: #9ca3af; font-size: 14px; line-height: 1.5;">
            Klik tombol di bawah untuk memberikan izin akses kamera dan masuk ke pengalaman Augmented Reality.
        </p>
        <button id="start-btn" onclick="initAR()">Mulai Pengalaman AR</button>
    </div>

    <!-- TAMPILAN AR: Scene baru dimuat setelah tombol diklik -->
    <div id="ar-container">
        <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

            <a-assets>
                <a-asset-item id="laptop-model"
                    src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/CesiumMilkTruck/glTF-Binary/CesiumMilkTruck.glb"></a-asset-item>
            </a-assets>

            <a-marker preset="hiro">
                <a-entity gltf-model="#laptop-model" scale="0.5 0.5 0.5" position="0 0 0">
                </a-entity>
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>
    </div>

    <script>
        function initAR() {
            // 1. Sembunyikan layar pembuka
            document.getElementById('start-screen').style.display = 'none';

            // 2. Tampilkan container AR (ini akan memicu AR.js mengaktifkan webcam)
            document.getElementById('ar-container').style.display = 'block';
        }
    </script>
</body>

</html>
