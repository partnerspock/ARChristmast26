<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Pilih Objek AR</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    <style>
        :root {
            --bg: #eef1f4;
            --fg: #14202b;
            --muted: #5b6b79;
            --accent: #0a7cff;
            --accent-fg: #fff;
            --card: #fff;
            --line: #d5dce3;
            --card-hover: #f8fafc;
        }

        @media (prefers-color-scheme:dark) {
            :root {
                --bg: #0e141b;
                --fg: #e9eef3;
                --muted: #93a3b2;
                --accent: #4da3ff;
                --accent-fg: #06121f;
                --card: #16202a;
                --line: #2a3947;
                --card-hover: #1e293b;
            }
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%;
            margin: 0
        }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
            overflow-y: auto;
        }

        header {
            padding: 18px 20px 6px;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.4rem, 4vw, 2rem);
            letter-spacing: -.02em
        }

        header p {
            margin: 6px auto 0;
            color: var(--muted);
            line-height: 1.5;
            max-width: 52ch;
            font-size: .95rem
        }

        /* Selection Grid untuk 2 Objek */
        .selection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            padding: 16px 20px;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .05);
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
        }

        .card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .thumbnail-container {
            width: 100%;
            height: 110px;
            border-radius: 10px;
            overflow: hidden;
            background: var(--bg);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .thumbnail-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card h3 {
            margin: 0 0 4px;
            font-size: 1rem;
        }

        .card-btn {
            margin-top: 8px;
            width: 100%;
            background: var(--accent);
            color: var(--accent-fg);
            border: 0;
            border-radius: 10px;
            padding: 10px 12px;
            font: inherit;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
        }

        .card-btn:active {
            transform: scale(0.97);
        }

        /* Preview Container */
        .preview-container {
            flex: 1;
            width: 100%;
            min-height: 250px;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        model-viewer {
            flex: 1;
            width: 100%;
            min-height: 0;
            --poster-color: transparent;
            background: transparent;
        }

        .ar-btn {
            position: absolute;
            left: 50%;
            bottom: 22px;
            transform: translateX(-50%);
            background: var(--accent);
            color: var(--accent-fg);
            border: 0;
            border-radius: 14px;
            padding: 14px 28px;
            font: inherit;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, .3);
            display: none;
            /* Sembunyikan tombol bawaan, gunakan tombol di card */
        }

        .note {
            margin: 10px 16px 20px;
            padding: 12px 14px;
            border: 1px solid var(--line);
            background: var(--card);
            border-radius: 12px;
            color: var(--muted);
            font-size: .85rem;
            line-height: 1.5;
            text-align: center;
        }

        [hidden] {
            display: none !important
        }
    </style>
</head>

<body>
    <header>
        <h1>Pilih Objek untuk AR</h1>
        <p>Pilih objek di bawah untuk melihat preview 3D atau langsung jalankan mode AR di ruanganmu.</p>
    </header>

    <!-- 2 Pilihan Tombol & Thumbnail -->
    <div class="selection-grid">
        <!-- Object A: Laptop -->
        <div class="card" onclick="selectAndPlayAR('laptop.glb')">
            <div class="thumbnail-container">
                <!-- Ganti 'laptop-thumb.jpg' dengan file gambar thumbnail laptop kamu -->
                <img src="laptop.png" alt="Thumbnail Laptop"
                    onerror="this.src='https://via.placeholder.com/150?text=Laptop'">
            </div>
            <h3>Laptop</h3>
            <button class="card-btn">Mulai AR Laptop</button>
        </div>

        <!-- Object B: Kotak -->
        <div class="card" onclick="selectAndPlayAR('jesus.glb')">
            <div class="thumbnail-container">
                <!-- Ganti 'box-thumb.jpg' dengan file gambar thumbnail kotak kamu -->
                <img src="jesus.jpg" alt="Thumbnail Kotak"
                    onerror="this.src='https://via.placeholder.com/150?text=Kotak'">
            </div>
            <h3>Kotak</h3>
            <button class="card-btn">Mulai AR Kotak</button>
        </div>
    </div>

    <!-- Area Preview 3D (Default memuat laptop.glb) -->
    <div class="preview-container">
        <model-viewer id="mv" src="laptop.glb" alt="Model 3D" ar ar-modes="webxr scene-viewer quick-look"
            ar-scale="auto" ar-placement="floor" camera-controls auto-rotate touch-action="pan-y" shadow-intensity="1"
            environment-image="neutral" xr-environment>
        </model-viewer>
    </div>

    <div class="note" id="noAr" hidden>
        AR tidak tersedia di perangkat atau browser ini. Buka halaman ini di HP: iPhone dengan Safari atau Android
        dengan Chrome.
    </div>

    <script>
        var mv = document.getElementById('mv'), noAr = document.getElementById('noAr');

        mv.addEventListener('load', function () {
            noAr.hidden = !!mv.canActivateAR;
        });

        // Fungsi untuk mengganti model 3D dan langsung memicu AR
        function selectAndPlayAR(modelFilename) {
            mv.setAttribute('src', modelFilename);

            // Tunggu sebentar hingga model termuat, lalu aktifkan mode AR secara otomatis
            mv.addEventListener('load', function onLoaded() {
                mv.removeEventListener('load', onLoaded);
                mv.activateAR().catch(function (error) {
                    console.log("Gagal mengaktifkan AR secara otomatis: ", error);
                });
            }, { once: true });
        }

        // Hentikan putar otomatis saat sesi AR berjalan
        mv.addEventListener('ar-status', function (e) {
            if (e.detail.status === 'session-started') {
                mv.removeAttribute('auto-rotate');
            }
        });
    </script>
</body>

</html>
