<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1a4a9c">
    <meta name="robots" content="noindex,nofollow">
    <title>Christmas 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700&display=swap"
        rel="stylesheet">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    <style>
        :root {
            --blue: #1a4a9c;
            --deep: #12336f;
            --yellow: #ffcb05
        }

        * {
            box-sizing: border-box;
            margin: 0
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Nunito', system-ui, sans-serif;
            color: #fff;
            background: var(--deep)
        }

        .swirl {
            position: fixed;
            inset: -30%;
            z-index: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, .55) 0, transparent 28%),
                conic-gradient(from 0deg at 50% 50%, #1b4aa8, #8fa8dc, #1b3f94, #c9d8f5, #2a5cc0, #7f9bd6, #1b4aa8);
            filter: blur(28px);
            animation: spin 40s linear infinite;
            will-change: transform
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        .frame {
            position: fixed;
            inset: 0;
            z-index: 1;
            /* border: 10px solid var(--blue); */
            border-radius: 26px;
            pointer-events: none
        }

        .stage {
            position: relative;
            z-index: 2;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            text-align: center;
            padding: calc(30px + env(safe-area-inset-top, 0px)) 24px calc(26px + env(safe-area-inset-bottom, 0px))
        }

        .title {
            font-family: 'Luckiest Guy', Impact, sans-serif;
            font-size: clamp(1.8rem, 9vw, 2.8rem);
            color: var(--yellow);
            -webkit-text-stroke: 6px var(--blue);
            paint-order: stroke fill;
            text-shadow: 0 4px 0 var(--deep)
        }

        .char {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 10px 0
        }

        .char img {
            max-width: 90%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 14px 18px rgba(0, 0, 0, .45));
            animation: float 3.2s ease-in-out infinite
        }

        @keyframes float {
            50% {
                transform: translateY(-10px)
            }
        }

        .reveal {
            background: none;
            border: 0;
            padding: 8px;
            cursor: pointer;
            width: min(36vw, 16dvh, 140px);
            min-width: 84px;
            filter: drop-shadow(0 10px 12px rgba(0, 0, 0, .5));
            animation: idle 2.6s ease-in-out infinite
        }

        .reveal img {
            width: 100%;
            display: block
        }

        @keyframes idle {

            0%,
            60%,
            100% {
                transform: rotate(0)
            }

            15% {
                transform: rotate(-8deg)
            }

            30% {
                transform: rotate(7deg)
            }

            45% {
                transform: rotate(-4deg)
            }
        }

        .reveal.shake {
            animation: shake .7s ease-in-out forwards
        }

        @keyframes shake {
            0% {
                transform: rotate(0) scale(1)
            }

            20% {
                transform: rotate(-18deg) scale(1.1)
            }

            40% {
                transform: rotate(16deg) scale(1.1)
            }

            60% {
                transform: rotate(-12deg) scale(1.15)
            }

            80% {
                transform: rotate(8deg) scale(1.2)
            }

            100% {
                transform: rotate(0) scale(1.3)
            }
        }

        .tap {
            font-size: .95rem;
            text-shadow: 0 2px 6px rgba(0, 0, 0, .5)
        }

        #flash {
            position: fixed;
            inset: 0;
            z-index: 8;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            transition: opacity .35s
        }

        #flash.on {
            opacity: 1
        }

        #viewer {
            position: fixed;
            inset: 0;
            z-index: 6;
            opacity: 0;
            pointer-events: none;
            transition: opacity .5s;
            background: radial-gradient(circle at 50% 40%, #4a73c9, #12336f)
        }

        #viewer.on {
            opacity: 1;
            pointer-events: auto
        }

        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent
        }

        .ar-btn {
            position: absolute;
            left: 50%;
            bottom: calc(26px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            white-space: nowrap;
            font-family: 'Luckiest Guy', Impact, sans-serif;
            font-size: 1.3rem;
            letter-spacing: .04em;
            color: var(--blue);
            background: var(--yellow);
            border: 4px solid var(--blue);
            border-radius: 999px;
            min-height: 54px;
            padding: 8px 36px;
            cursor: pointer;
            box-shadow: 0 5px 0 var(--deep)
        }

        .note {
            position: absolute;
            top: calc(18px + env(safe-area-inset-top, 0px));
            left: 0;
            right: 0;
            text-align: center;
            font-size: .9rem;
            text-shadow: 0 2px 6px rgba(0, 0, 0, .6);
            padding: 0 24px;
            pointer-events: none
        }

        @media (prefers-reduced-motion:reduce) {

            .swirl,
            .char img,
            .reveal {
                animation: none
            }
        }
    </style>
</head>

<body>
    <div class="swirl"></div>
    <div class="frame"></div>

    <div class="stage">
        <div class="title">Christmas 2026</div>
        <div class="char"><img src="char3.png" alt=""></div>
        <div>
            <button class="reveal" id="ball" aria-label="Reveal"><img src="../assets/pokeball.png" alt=""></button>
            <p class="tap">Tap to open</p>
        </div>
    </div>

    <div id="flash"></div>

    <div id="viewer">
        <model-viewer id="mv" src="char3.glb" poster="char3.png" alt="Christmas 2026 character" ar
            ar-modes="webxr scene-viewer quick-look" ar-scale="auto" ar-placement="floor" camera-controls
            touch-action="pan-y" autoplay shadow-intensity="1" environment-image="neutral" exposure="1.1"
            loading="eager">
            <button slot="ar-button" class="ar-btn">Lihat di AR</button>
        </model-viewer>
        <p class="note" id="note"></p>
    </div>

    <script>
        const ball = document.getElementById('ball'), mv = document.getElementById('mv'),
            viewer = document.getElementById('viewer'), flash = document.getElementById('flash'),
            note = document.getElementById('note');
        let loaded = false, wantAR = false;
        mv.addEventListener('load', () => { loaded = true; if (wantAR) launchAR(); });
        mv.addEventListener('error', () => { note.textContent = 'Model 3D gagal dimuat.'; });

        function launchAR() {
            wantAR = false;
            if (mv.canActivateAR) {
                try { mv.activateAR(); } catch (e) { note.textContent = 'Tekan "Lihat di AR" untuk membuka kamera.'; }
            } else {
                note.textContent = 'AR belum tersedia di perangkat ini. Putar model dengan jari.';
            }
        }

        // pokeball: shake -> flash -> langsung buka kamera AR
        ball.addEventListener('click', () => {
            if (ball.classList.contains('shake')) return;
            ball.classList.add('shake');
            setTimeout(() => flash.classList.add('on'), 600);
            setTimeout(() => {
                viewer.classList.add('on');
                flash.classList.remove('on');
                if (loaded) launchAR(); else { wantAR = true; note.textContent = 'Memuat model...'; }
            }, 950);
        });
    </script>
</body>

</html>
