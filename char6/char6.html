<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#8a1008">
    <meta name="robots" content="noindex,nofollow">
    <title>Christmas 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --red: #9a1409;
            --gold: #f2b630;
        }

        * {
            box-sizing: border-box;
            margin: 0
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Nunito', system-ui, sans-serif;
            color: var(--red);
            /* ===== BACKGROUND =====
               100% 100% = gambar memenuhi layar (agak melar di HP).
               Ganti ke "cover" kalau mau proporsi asli (tepi bisa terpotong),
               atau "contain" kalau mau utuh (ada sisa warna merah di atas/bawah). */
            background: rgb(253, 241, 223) url('../assets/Group_60.png') center / 100% 100% no-repeat
        }

        /* Area krem di gambar: kira-kira 5%-95% lebar, 4%-92% tinggi.
           Bintang atas sampai ~10% tinggi. Atur padding di .stage kalau konten kurang pas. */
        .stage {
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            text-align: center;
            padding: calc(11dvh + env(safe-area-inset-top, 0px)) 10vw calc(9dvh + env(safe-area-inset-bottom, 0px))
        }

        .title {
            font-family: 'Luckiest Guy', Impact, sans-serif;
            font-size: clamp(1.6rem, 8.5vw, 2.6rem);
            color: var(--red);
            text-shadow: 0 3px 0 var(--gold)
        }

        .char {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 10px 0
        }

        .char img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 12px 14px rgba(90, 20, 10, .35));
            animation: float 3.2s ease-in-out infinite
        }

        @keyframes float {
            50% {
                transform: translateY(-10px)
            }
        }

        .reveal {
            background: none;
            border: 0;
            padding: 8px;
            cursor: pointer;
            width: min(30vw, 14dvh, 120px);
            min-width: 76px;
            filter: drop-shadow(0 8px 10px rgba(90, 20, 10, .4));
            animation: idle 2.6s ease-in-out infinite
        }

        .reveal img {
            width: 100%;
            display: block
        }

        @keyframes idle {

            0%,
            60%,
            100% {
                transform: rotate(0)
            }

            15% {
                transform: rotate(-8deg)
            }

            30% {
                transform: rotate(7deg)
            }

            45% {
                transform: rotate(-4deg)
            }
        }

        .reveal.shake {
            animation: shake .7s ease-in-out forwards
        }

        @keyframes shake {
            0% {
                transform: rotate(0) scale(1)
            }

            20% {
                transform: rotate(-18deg) scale(1.1)
            }

            40% {
                transform: rotate(16deg) scale(1.1)
            }

            60% {
                transform: rotate(-12deg) scale(1.15)
            }

            80% {
                transform: rotate(8deg) scale(1.2)
            }

            100% {
                transform: rotate(0) scale(1.3)
            }
        }

        .tap {
            font-size: .95rem
        }

        #flash {
            position: fixed;
            inset: 0;
            z-index: 8;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            transition: opacity .35s
        }

        #flash.on {
            opacity: 1
        }

        @media (prefers-reduced-motion:reduce) {

            .char img,
            .reveal {
                animation: none
            }
        }
    </style>
</head>

<body>
    <div class="stage">
        <div class="title">Christmas 2026</div>
        <div class="char"><img src="char6.png" alt=""></div>
        <div>
            <button class="reveal" id="ball" aria-label="Reveal"><img src="../assets/box.png" alt=""></button>
            <p class="tap">Tap to reveal</p>
        </div>
    </div>

    <div id="flash"></div>

    <script>
        const ball = document.getElementById('ball'), flash = document.getElementById('flash');

        ball.addEventListener('click', () => {
            if (ball.classList.contains('shake')) return;
            ball.classList.add('shake');
            setTimeout(() => flash.classList.add('on'), 600);
            setTimeout(() => { location.href = 'trigger6.html'; }, 950);
        });
    </script>
</body>

</html>
