<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow">
    <title>Christmas 2026</title>

    <!-- Hanya 3 script ini. Jangan tambah mindar-image.prod.js atau mindar-image-three.prod.js -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        /* JANGAN kasih background berwarna di html/body: video kamera ada di belakang dan akan tertutup */
        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: system-ui, sans-serif
        }

        #hint {
            position: fixed;
            left: 0;
            right: 0;
            bottom: calc(32px + env(safe-area-inset-bottom, 0px));
            z-index: 10;
            text-align: center;
            color: #fff;
            font-size: 1rem;
            text-shadow: 0 2px 8px rgba(0, 0, 0, .8);
            pointer-events: none;
            padding: 0 24px;
            transition: opacity .3s
        }

        #hint.off {
            opacity: 0
        }

        /* status debug, hapus elemen #dbg dan script-nya kalau sudah beres */
        #dbg {
            position: fixed;
            top: calc(12px + env(safe-area-inset-top, 0px));
            left: 0;
            right: 0;
            z-index: 10;
            text-align: center;
            color: #ff0;
            font-size: .8rem;
            text-shadow: 0 1px 4px #000;
            pointer-events: none;
            padding: 0 16px
        }
    </style>
</head>

<body>

    <p id="hint">Membuka kamera...</p>
    <p id="dbg"></p>

    <a-scene mindar-image="imageTargetSrc: ./6.mind; autoStart: true; uiLoading: yes; uiScanning: no; uiError: yes;"
        color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets timeout="30000">
            <a-asset-item id="model" src="./char6.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity light="type: ambient; intensity: 1.2"></a-entity>
        <a-entity light="type: directional; intensity: 1.5" position="1 2 3"></a-entity>

        <a-entity id="target" mindar-image-target="targetIndex: 0">
            <!-- tes deteksi: hapus tanda komentar baris di bawah, kotak merah harus muncul di atas kartu
            <a-plane color="red" opacity="0.6" width="1" height="1" position="0 0 0"></a-plane> -->

            <!-- rotation: kalau model tergeletak ganti "0 0 0". scale: besar/kecil. position z: tinggi dari kartu -->
            <a-gltf-model src="#model" rotation="90 0 0" position="0 0 0" scale="0.5 0.5 0.5"
                animation-mixer></a-gltf-model>
        </a-entity>
    </a-scene>

    <script>
        const hint = document.getElementById('hint'), dbg = document.getElementById('dbg'),
            t = document.getElementById('target'), scene = document.querySelector('a-scene'),
            mdl = document.querySelector('a-gltf-model');

        let step = 'kamera: memuat | GLB: memuat';
        const show = () => dbg.textContent = step;
        show();

        scene.addEventListener('arReady', () => {
            hint.textContent = 'Arahkan kamera ke kartu';
            step = step.replace('kamera: memuat', 'kamera: OK'); show();
        });
        scene.addEventListener('arError', () => {
            hint.textContent = 'Kamera gagal dibuka. Buka lewat Safari dan izinkan akses kamera.';
            hint.classList.remove('off');
            step = step.replace('kamera: memuat', 'kamera: ERROR'); show();
        });
        mdl.addEventListener('model-loaded', () => { step = step.replace('GLB: memuat', 'GLB: OK'); show(); });
        mdl.addEventListener('model-error', () => { step = step.replace('GLB: memuat', 'GLB: GAGAL'); show(); });

        t.addEventListener('targetFound', () => { hint.classList.add('off'); dbg.textContent = step + ' | kartu: TERDETEKSI'; });
        t.addEventListener('targetLost', () => { hint.classList.remove('off'); dbg.textContent = step + ' | kartu: hilang'; });

        window.addEventListener('error', e => { dbg.textContent = 'Error: ' + e.message; });
        window.addEventListener('unhandledrejection', e => { dbg.textContent = 'Error: ' + (e.reason && e.reason.message || e.reason); });
    </script>
</body>

</html>
